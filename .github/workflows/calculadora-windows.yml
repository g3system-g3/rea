name: Calculadora Windows

on:
  push:
    paths:
      - "calculadora-celular/**"
      - ".github/workflows/calculadora-windows.yml"
  pull_request:
    paths:
      - "calculadora-celular/**"
      - ".github/workflows/calculadora-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Testar e gerar instalador
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: calculadora-celular
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Testes
        run: python -m unittest -v
      - name: Instalar ferramentas
        run: python -m pip install pyinstaller==6.11.1 pillow==11.0.0
      - name: Gerar ícone
        run: python make_icon.py
      - name: Gerar .exe
        run: python -m PyInstaller --onefile --windowed --name Calculadora --icon icon.ico --add-data "icon.ico;." calculadora.py
      - name: Gerar instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc instalador.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Calculadora-Windows
          path: |
            calculadora-celular/dist/Instalar-Calculadora.exe
            calculadora-celular/dist/Calculadora.exe
          if-no-files-found: error

name: Calculadora Windows

on:
  push:
    paths:
      - "calculadora-celular/**"
      - ".github/workflows/calculadora-windows.yml"
  pull_request:
    paths:
      - "calculadora-celular/**"
      - ".github/workflows/calculadora-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Testar e gerar Calculadora.exe
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: calculadora-celular
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Testes
        run: python -m unittest -v
      - name: Instalar PyInstaller
        run: python -m pip install pyinstaller==6.11.1
      - name: Gerar .exe
        run: python -m PyInstaller --onefile --windowed --name Calculadora calculadora.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Calculadora-Windows
          path: calculadora-celular/dist/Calculadora.exe
          if-no-files-found: error
